name: Tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Reject tracked runtime state and secret files
        shell: bash
        run: |
          for path in .env data/ai_data.json data/state.json; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "::error::Sensitive runtime file must not be tracked: $path"
              exit 1
            fi
          done
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q main.py config.py cogs tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Docker build-context exclusions
        shell: bash
        run: |
          test -f .dockerignore
          for pattern in ".env" ".env.*" "!.env.example" "data/ai_data.json" "data/state.json" "data/backups/"; do
            if ! grep -Fxq "$pattern" .dockerignore; then
              echo "::error::Missing Docker ignore rule: $pattern"
              exit 1
            fi
          done
          grep -Fxq "*.db" .dockerignore
      - name: Build Docker image
        run: |
          for attempt in 1 2 3; do
            if docker build --pull -t casino-bot:test .; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Docker build failed; retrying ($attempt/3)..."
              sleep 5
            fi
          done
          exit 1
      - name: Smoke-test startup without a token
        run: |
          output="$(docker run --rm -e DISCORD_TOKEN= casino-bot:test)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -F "DISCORD_TOKEN is missing"
