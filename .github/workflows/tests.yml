name: Tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Reject tracked runtime state and environment secrets
        shell: bash
        run: |
          while IFS= read -r path; do
            case "$path" in
              .env.example|*/.env.example) ;;
              .env|.env.*|*/.env|*/.env.*)
                echo "::error::Potential environment secret must not be tracked: $path"
                exit 1
                ;;
            esac
          done < <(git ls-files)

          while IFS= read -r path; do
            case "$path" in
              data/ai_data.json|data/state.json|data/used_images.json|data/currency.json|archive-wrapper-files/data/*|archive-wrapper-files/bot_logs.txt|bot_logs.txt|*.db|*.db-*|*.sqlite|*.sqlite-*|*.sqlite3|*.sqlite3-*)
                echo "::error::Runtime database, generated state or log must not be tracked: $path"
                exit 1
                ;;
            esac
          done < <(git ls-files)
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q main.py config.py cogs tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Docker build-context exclusions
        shell: bash
        run: |
          test -f .dockerignore
          for pattern in ".env" ".env.*" "!.env.example" "data/ai_data.json" "data/state.json" "data/used_images.json" "data/currency.json" "data/backups/" "archive-wrapper-files/" "bot_logs.txt"; do
            if ! grep -Fxq "$pattern" .dockerignore; then
              echo "::error::Missing Docker ignore rule: $pattern"
              exit 1
            fi
          done
          grep -Fxq "*.db" .dockerignore
      - name: Build Docker image
        run: |
          for attempt in 1 2 3; do
            if docker build --pull -t casino-bot:test .; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Docker build failed; retrying ($attempt/3)..."
              sleep 5
            fi
          done
          exit 1
      - name: Verify image contains static data but no runtime secrets
        run: |
          docker run --rm -e DISCORD_TOKEN= casino-bot:test sh -c '
            test -f /app/data/database.json
            test -f /app/data/fazoora.json
            test ! -e /app/data/ai_data.json
            test ! -e /app/data/state.json
            test ! -e /app/data/used_images.json
            test ! -e /app/data/bank.db
            test ! -e /app/.env
            test ! -e /app/data/currency.json
            test ! -e /app/archive-wrapper-files
            test ! -e /app/bot_logs.txt
          '
      - name: Smoke-test startup without a token
        run: |
          output="$(docker run --rm -e DISCORD_TOKEN= casino-bot:test)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -F "DISCORD_TOKEN is missing"
