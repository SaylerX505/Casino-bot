name: Tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    name: Python tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Reject tracked runtime state and environment secrets
        shell: bash
        run: |
          while IFS= read -r path; do
            case "$path" in
              .env.example|*/.env.example) ;;
              .env|.env.*|*/.env|*/.env.*)
                echo "::error::Potential environment secret must not be tracked: $path"
                exit 1
                ;;
            esac
          done < <(git ls-files)

          while IFS= read -r path; do
            case "$path" in
              data/ai_data.json|data/state.json|data/used_images.json|data/used_images.json.tmp|data/currency.json|archive-wrapper-files/data/*|archive-wrapper-files/bot_logs.txt|bot_logs.txt|*.db|*.db-*|*.sqlite|*.sqlite-*|*.sqlite3|*.sqlite3-*)
                echo "::error::Runtime database, generated state or log must not be tracked: $path"
                exit 1
                ;;
            esac
          done < <(git ls-files)
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify native-host and Docker dependency manifests match
        run: |
          python - <<'PY'
          from pathlib import Path

          def entries(path):
              return [
                  line.strip()
                  for line in Path(path).read_text(encoding="utf-8").splitlines()
                  if line.strip() and not line.lstrip().startswith("#")
              ]

          runtime = entries("requirements.txt")
          locked = entries("requirements.lock")
          if runtime != locked:
              missing = sorted(set(locked) - set(runtime))
              extra = sorted(set(runtime) - set(locked))
              raise SystemExit(
                  f"Dependency manifests differ; missing={missing!r}, extra={extra!r}"
              )
          PY
      - name: Install locked runtime dependencies and test tools
        run: python -m pip install -r requirements.lock ruff coverage
      - name: Run Ruff static analysis on maintained core and regression tests
        run: |
          python -m ruff check --output-format=github main.py config.py cogs/utility/diagnostics.py cogs/casino/bank.py cogs/casino/bank_ledger.py cogs/casino/bank_schema.py cogs/casino/bet_validation.py cogs/casino/permissions.py cogs/casino/currency.py cogs/casino/rps.py cogs/casino/roulette_art.py cogs/casino/roulette_views.py cogs/casino/solo_betting.py cogs/casino/solo_advanced.py cogs/casino/blackjack.py cogs/casino/game_assets.py cogs/casino/geoguessr_art.py cogs/casino/geoguessr_storage.py cogs/casino/geoguessr_views.py cogs/casino/mafia_art.py cogs/casino/mafia_views.py cogs/casino/currency_catalog.py cogs/casino/currency_views.py cogs/utility/admin.py cogs/utility/ai.py cogs/utility/help.py cogs/utility/wizard.py tests/test_game_channel_policy.py tests/test_wizard.py tests/test_app_settings.py tests/test_ai_privacy.py tests/test_app_command_errors.py tests/test_component_emoji_regression.py tests/test_command_groups.py tests/test_currency_profile_registration.py tests/test_lobby_startup_error_safety.py tests/test_roulette_weapon_concurrency.py tests/test_command_error_logging.py tests/test_diagnostics.py tests/test_help_menu.py tests/test_currency_audit_logging.py tests/test_geoguessr_scoring.py tests/test_geoguessr_storage.py tests/test_geoguessr_art.py tests/test_mafia_scan_privacy.py tests/test_bank_mutator_validation.py tests/test_home_guild_policy.py tests/test_bank_validation.py tests/test_bet_validation.py tests/test_game_ui_v2.py tests/test_rps_retry.py tests/test_rps_ui_reliability.py tests/test_rps_wagers.py tests/test_roulette_art.py tests/test_extension_loader.py tests/test_bank_migrations_ledger.py tests/test_casino_wagers.py tests/test_coinflip_ui.py tests/test_slots.py tests/test_blackjack.py tests/test_components_v2_policy.py tests/test_currency_callback_threading.py tests/test_public_game_lobbies.py tests/test_lobby_ux.py cogs/casino/fazoora.py tests/test_roulette_result_delivery.py tests/test_fazoora_ui.py tests/test_solo_wager_recovery.py tests/test_solo_advanced.py cogs/utility/theme.py cogs/casino/chairs.py cogs/casino/hide_and_seek.py cogs/casino/mafia.py cogs/casino/roulette.py cogs/casino/wheel.py cogs/casino/geoguessr.py tests/test_developer_credit.py tests/test_wager_preflight.py
      - name: Broad syntax and undefined-name scan
        run: python -m ruff check --output-format=github --select E4,E9,F821 main.py config.py cogs tests
      - name: Compile Python files
        run: python -m compileall -q main.py config.py cogs tests
      - name: Run unit tests with branch coverage
        run: coverage run --branch -m unittest discover -s tests -v
      - name: Report coverage for reliability-critical modules
        run: coverage report --show-missing --include=cogs/casino/bank.py,cogs/casino/bank_ledger.py,cogs/casino/bank_schema.py,cogs/casino/permissions.py,cogs/casino/geoguessr_storage.py

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Docker build-context exclusions
        shell: bash
        run: |
          test -f .dockerignore
          for pattern in ".env" ".env.*" "!.env.example" "data/logs/" "data/ai_data.json" "data/state.json" "data/used_images.json" "data/used_images.json.tmp" "data/currency.json" "data/backups/" "archive-wrapper-files/" "bot_logs.txt"; do
            if ! grep -Fxq "$pattern" .dockerignore; then
              echo "::error::Missing Docker ignore rule: $pattern"
              exit 1
            fi
          done
          grep -Fxq "*.db" .dockerignore
      - name: Build Docker image
        run: |
          for attempt in 1 2 3; do
            if docker build --pull -t casino-bot:test .; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Docker build failed; retrying ($attempt/3)..."
              sleep 5
            fi
          done
          exit 1
      - name: Verify image contains static data but no runtime secrets
        run: |
          docker run --rm -e DISCORD_TOKEN= casino-bot:test sh -c '
            test -f /app/data/database.json
            test -f /app/data/fazoora.json
            test ! -e /app/data/ai_data.json
            test ! -e /app/data/state.json
            test ! -e /app/data/used_images.json
            test ! -e /app/data/used_images.json.tmp
            test ! -e /app/data/bank.db
            test ! -e /app/data/logs/casino-bot.log
            test ! -e /app/.env
            test ! -e /app/data/currency.json
            test ! -e /app/archive-wrapper-files
            test ! -e /app/bot_logs.txt
          '
      - name: Smoke-test startup without a token
        run: |
          output="$(docker run --rm -e DISCORD_TOKEN= casino-bot:test 2>&1)"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -F "DISCORD_TOKEN is missing"
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependency auditor
        run: python -m pip install pip-audit
      - name: Audit locked runtime dependencies
        run: pip-audit --requirement requirements.lock
